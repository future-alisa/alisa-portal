services:
  api:
    build: ./backend
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      DATA_FILE: /data/portal.json
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      ALISA_OAUTH_ISSUER: ${ALISA_OAUTH_ISSUER:-}
      ALISA_PORTAL_ORIGIN: ${ALISA_PORTAL_ORIGIN:-}
      ALISA_OAUTH_CLIENT_ID: ${ALISA_OAUTH_CLIENT_ID:-}
      ALISA_OAUTH_CLIENT_SECRET: ${ALISA_OAUTH_CLIENT_SECRET:-}
      ALISA_OAUTH_RESOURCE_CLIENT_ID: ${ALISA_OAUTH_RESOURCE_CLIENT_ID:-}
      ALISA_OAUTH_RESOURCE_CLIENT_SECRET: ${ALISA_OAUTH_RESOURCE_CLIENT_SECRET:-}
      ALISA_OAUTH_TENANT_ID: ${ALISA_OAUTH_TENANT_ID:-}
      ALISA_OAUTH_ALLOW_API_TOKEN: ${ALISA_OAUTH_ALLOW_API_TOKEN:-false}
    volumes:
      - portal-data:/data
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        API_URL: http://api:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  portal-data:
