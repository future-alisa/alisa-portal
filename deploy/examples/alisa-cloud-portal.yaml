# Import into alisa-user after backing up its DB and installing the schemas
# documented in alisa-cloud/OAUTH.md. This file is NOT in the production overlay.
# Merge into existing application catalogs; do not replace other app settings.
alisa:
  oauth:
    enabled: true
    issuer: ${OAUTH_ISSUER}
    applications:
      portal:
        "[portal:console:manage]": 管理整个门户实例（包括所有登记资源和基础设施租户）
        "[portal:service:read]": 查看服务资源及入口
        "[portal:service:create]": 登记服务
        "[portal:service:update]": 更新服务及公开范围
        "[portal:service:delete]": 移除服务
        "[portal:tenant:read]": 查看门户命名空间
        "[portal:tenant:create]": 登记门户命名空间
        "[portal:deployment:read]": 查看部署申请和清单
        "[portal:deployment:create]": 生成部署清单
        "[portal:network:read]": 查看网络配置
        "[portal:network:update]": 更新网络配置
        "[portal:event:read]": 查看门户操作记录
        "[portal:metrics:read]": 查看运行指标
  authorization:
    enabled: true
    applications:
      # Use tenant instead of local ONLY when upstream tenancy is enabled.
      # Then portal's ALISA_OAUTH_TENANT_ID must name the owning auth tenant.
      portal: local
    administrators: ${AUTHORIZATION_ADMINISTRATORS}
