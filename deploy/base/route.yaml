apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alisa-portal
spec:
  hostnames:
    - alisa.vip.cpolar.cn
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 3000
