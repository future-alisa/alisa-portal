apiVersion: v1
kind: Namespace
metadata:
  name: alisa-portal
---
apiVersion: batch/v1
kind: Job
metadata:
  name: portal-registry-details
  namespace: alisa-portal
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: check
          image: curlimages/curl:8.17.0
          command: [sh, -c]
          args:
            - |
              echo INTERNAL_HTTP
              curl --max-time 20 -sS -i http://registry.kind.internal:5000/v2/ || true
              echo INTERNAL_HTTPS
              curl --max-time 20 -sS -i https://registry.kind.internal:5000/v2/ || true
              echo PUBLIC_HTTPS
              curl --max-time 20 -sS -i https://alisa-registry.cpolar.top/v2/ || true
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
