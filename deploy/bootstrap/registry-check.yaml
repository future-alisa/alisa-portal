apiVersion: v1
kind: Namespace
metadata:
  name: alisa-portal
---
apiVersion: batch/v1
kind: Job
metadata:
  name: portal-registry-check
  namespace: alisa-portal
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: check
          image: curlimages/curl:8.17.0
          command: [sh, -c]
          args:
            - 'curl --max-time 20 -sS -o /dev/null -w "registry_http_status=%{http_code}\n" http://registry.kind.internal:5000/v2/'
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
